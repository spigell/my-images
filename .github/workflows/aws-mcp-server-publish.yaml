name: Build and Publish AWS MCP Server image

on:
  repository_dispatch:
    types: [universal-workbench-updated]
  push:
    branches-ignore:
      - 'renovate/**'
    paths:
      - 'aws-mcp-server-docker/**'
      - '.github/workflows/aws-mcp-server-publish.yaml'
  workflow_dispatch:
    inputs:
      universal_tag:
        description: Universal Workbench tag (optional; falls back to GHCR latest)
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  resolve-universal-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.final-tag.outputs.tag }}
      version: ${{ steps.package-versions.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/resolve-ghcr-tag
        id: final-tag
        with:
          owner: ${{ github.repository_owner }}
          image: universal-workbench
          payload_tag: ${{ github.event.client_payload.universal_tag }}
          input_tag: ${{ inputs.universal_tag }}
          ghcr_token: ${{ secrets.IMAGES_PUBLISH_TOKEN }}
      - name: Resolve AWS MCP package versions
        id: package-versions
        shell: bash
        run: |
          eks_version="$(sed -n 's/^ARG AWS_EKS_MCP_VERSION=\([^ ]*\).*/\1/p' aws-mcp-server-docker/Dockerfile)"
          pricing_version="$(sed -n 's/^ARG AWS_PRICING_MCP_VERSION=\([^ ]*\).*/\1/p' aws-mcp-server-docker/Dockerfile)"
          test -n "${eks_version}"
          test -n "${pricing_version}"
          echo "version=eks-${eks_version}-pricing-${pricing_version}" >> "${GITHUB_OUTPUT}"

  build-aws-mcp-server:
    needs:
      - resolve-universal-tag
    uses: spigell/my-shared-workflows/.github/workflows/docker-build-release.yaml@main
    secrets:
      gh-token: ${{ secrets.IMAGES_PUBLISH_TOKEN }}
    with:
      image-name: aws-mcp-server
      context: ./aws-mcp-server-docker
      version: ${{ needs.resolve-universal-tag.outputs.version }}
      build-args: |
        UNIVERSAL_WORKBENCH_IMAGE_TAG=${{ needs.resolve-universal-tag.outputs.tag }}
